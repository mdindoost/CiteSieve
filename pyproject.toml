[project]
name = "citesieve"
version = "0.1.0"
description = "CiteSieve: analyze citations (OpenAlex + Semantic Scholar), filter reviews, estimate actual usage."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{ name = "Mohammad Dindoost", email = "md72@njit.edu" }]
dependencies = [
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "pyyaml>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/mdindoost/CiteSieve"

[project.scripts]
citesieve = "citesieve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["citesieve*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"



